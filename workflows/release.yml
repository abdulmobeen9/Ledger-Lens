name: LedgerLens Release

# Push a tag like v1.1.0 (or run manually) to build a signed APK + AAB and publish a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v1.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets."; exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set. The APK will be signed with the debug key and cannot be uploaded to Google Play."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold if missing
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            bash scripts/bootstrap_android.sh
          else
            python3 scripts/patch_signing.py
            python3 scripts/patch_r8_rules.py
          fi

      - name: Install dependencies and generate code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Configure release signing
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build APK and AAB
        run: |
          DEFINES="--dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          flutter build apk --release $DEFINES
          flutter build appbundle --release $DEFINES

      - name: Name artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/LedgerLens-$TAG.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/LedgerLens-$TAG.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: ledgerlens-release-${{ env.TAG }}
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: LedgerLens ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*
