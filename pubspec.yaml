name: ledgerlens
description: Offline-first income and expense manager with receipt OCR.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  path: ^1.9.1
  supabase_flutter: ^2.8.4
  go_router: ^14.8.1
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  fl_chart: ^0.70.2
  intl: ^0.20.2
  uuid: ^4.5.1
  connectivity_plus: ^6.1.3
  csv: ^6.0.0
  share_plus: ^10.1.4
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  workmanager: ^0.6.0
  shared_preferences: ^2.3.4
  crypto: ^3.0.6
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
